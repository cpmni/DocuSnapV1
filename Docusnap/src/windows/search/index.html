<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; img-src 'self' data:; form-action 'none'; base-uri 'none'; object-src 'none'">
  <title>ScanFinder — Search</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <!-- THIS PAGE IS A THIN SHELL (client search parity, S0b 2026-09-13). The Search screen itself — its
       markup (search-ui/searchMarkup.js, mounted into #app at load), its layout styles (searchUI.css) and
       its component re-skin (searchComponents.css) — is the ONE shared module under ../shared/search-ui/,
       also driven by the detached client's search pop-out via a generated copy. Edit the shared files, never
       a copy. Only the core's native chrome (#titlebar below) and the core-only modules stay here. -->
  <style>
    /* Core chrome only: the (native-frame-hidden) title bar. Everything else lives in the shared CSS. */
    #titlebar {
      -webkit-app-region: drag;
      display: flex; align-items: center; justify-content: space-between;
      height: 38px; padding: 0 12px 0 16px;
      background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .tb-title { font-size: 11px; font-weight: 500; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
    .tb-right { display: flex; align-items: center; gap: 8px; -webkit-app-region: no-drag; }
    .tb-btn {
      -webkit-app-region: no-drag;
      width: 26px; height: 20px; border-radius: 4px; border: none; cursor: pointer;
      background: var(--surface2); color: var(--muted); font-size: 13px;
      display: flex; align-items: center; justify-content: center;
    }
    .tb-btn.close:hover { background: var(--err); color: #fff; }
  </style>
  <!-- CASCADE ORDER IS LOAD-BEARING: theme tokens → the screen's layout styles → the component re-skin
       (loaded AFTER so its treatments win on equal specificity — it used to follow the inline <style>). -->
  <link rel="stylesheet" href="../shared/search-ui/searchUI.css" />
  <link rel="stylesheet" href="../shared/search-ui/searchComponents.css" />
</head>
<body>
<div id="app">
  <div id="titlebar">
    <span class="tb-title">ScanFinder — Search</span>
    <div class="tb-right">
      <button class="tb-btn help-guide-btn" id="btn-help-guide" title="Open the user guide (Search)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></button>
      <button class="tb-btn" id="help-mode-toggle" data-help-key="help-mode" title="Help mode — click, then click any control to learn what it does">?</button>
      <button class="tb-btn close" id="btn-close" title="Close">&#215;</button>
    </div>
  </div></div><!-- #app: the shared search screen (#search-bar, #date-range-note, #body) is mounted here by
                       search-ui/searchMarkup.js as DIRECT children after #titlebar — no wrapper (the
                       #app flex-column → #body flex:1 height chain). Nothing may follow #titlebar here. -->

<script src="../shared/theme.js"></script>
<script src="../shared/helpmode.js"></script>
<!-- NOTE: ../shared/thumbs.js is deliberately NOT loaded here — the shared search UI ships its own
     transport-fed loader (search-ui/searchThumbs.js, global SearchThumbs); two scripts assigning
     window.Thumbs would be load-order roulette the collision pin cannot see (Oracle 2026-09-13). -->
<!-- Focus repair: arms this window's native confirm()/alert() dialogs + provides focusField()
     for programmatic input focus (the workflow note). Search had no dialog wrapper before. -->
<script src="../shared/dialogFocus.js"></script>
<!-- SHARED SEARCH UI (client search parity, 2026-09-13): the adapter FIRST (defines window.SearchTransport),
     then the ONE canonical search screen under ../shared/search-ui/ — markup first (it mounts the DOM the
     rest wire to), then the modules — then the core-only modules. Also driven by the detached client via a
     generated copy — edit the shared files, never a copy. -->
<script src="coreTransport.js"></script>
<script src="../shared/search-ui/searchMarkup.js"></script>
<script src="../shared/search-ui/searchState.js"></script>
<script src="../shared/search-ui/searchThumbs.js"></script>
<script src="../shared/search-ui/searchActions.js"></script>
<script src="../shared/search-ui/searchResults.js"></script>
<script src="../shared/search-ui/searchPreview.js"></script>
<script src="../shared/search-ui/searchQuery.js"></script>
<script src="../shared/search-ui/searchInit.js"></script>
<script src="search-workflow.js"></script>
<script src="search-mailbox.js"></script>
<script src="search-stamp.js"></script>
<script src="renderer.js"></script>
</body>
</html>
