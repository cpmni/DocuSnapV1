<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>ScanFinder — Search</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Palette + tokens are centralised in shared/theme.css (light default + matching dark). */
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; overflow: hidden; }

    #titlebar {
      -webkit-app-region: drag;
      display: flex; align-items: center; justify-content: space-between;
      height: 38px; padding: 0 12px 0 16px;
      background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .tb-title { font-size: 11px; font-weight: 500; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
    .tb-right { display: flex; align-items: center; gap: 8px; -webkit-app-region: no-drag; }
    .tb-btn {
      -webkit-app-region: no-drag;
      width: 26px; height: 20px; border-radius: 4px; border: none; cursor: pointer;
      background: var(--surface2); color: var(--muted); font-size: 13px;
      display: flex; align-items: center; justify-content: center;
    }
    .tb-btn.close:hover { background: var(--err); color: #fff; }

    #app { display: flex; flex-direction: column; height: 100vh; }

    #search-bar {
      display: flex; align-items: center; gap: 8px; padding: 10px 16px;
      background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
    }
    .search-input {
      background: var(--bg); border: 1px solid var(--border2); border-radius: 5px;
      padding: 6px 10px; color: var(--text); font-family: var(--sans); font-size: 12px;
      outline: none; transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }
    #inp-fulltext  { width: 320px; }
    #inp-date-from, #inp-date-to { width: 120px; }
    #inp-type {
      background: var(--bg); border: 1px solid var(--border2); border-radius: 5px;
      padding: 6px 10px; color: var(--text); font-family: var(--sans); font-size: 12px;
      outline: none; cursor: pointer;
    }
    #inp-type:focus { border-color: var(--accent); }
    #btn-search {
      padding: 6px 16px; border-radius: 5px; border: 1px solid var(--accent);
      background: var(--accent); color: #fff; font-family: var(--sans); font-size: 12px;
      cursor: pointer; transition: opacity .15s; margin-left: auto;
    }
    #btn-search:hover { opacity: .85; }
    .uncommitted-toggle { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
    .uncommitted-toggle input { accent-color: var(--accent); cursor: pointer; }
    #btn-mailbox { padding: 6px 14px; border-radius: 5px; border: 1px solid var(--border2);
      background: var(--surface2); color: var(--text); font-size: 12px; cursor: pointer; }
    #btn-mailbox:hover { border-color: var(--accent2); color: var(--accent2); }
    #btn-recycle, #btn-empty-bin { padding: 6px 14px; border-radius: 5px; border: 1px solid var(--border2);
      background: var(--surface2); color: var(--text); font-family: var(--sans); font-size: 12px; cursor: pointer; }
    #btn-recycle:hover { border-color: var(--accent2); color: var(--accent2); }
    #btn-recycle.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent2); }
    #btn-empty-bin { color: var(--err); border-color: rgba(214,69,69,.4); }
    #btn-empty-bin:hover { background: var(--err-bg); border-color: var(--err); }
    body.mailbox-mode #inp-fulltext,
    body.mailbox-mode #inp-date-from, body.mailbox-mode #inp-date-to,
    body.mailbox-mode #inp-total, body.mailbox-mode #inp-total-op, body.mailbox-mode #inp-type,
    body.mailbox-mode .uncommitted-toggle, body.mailbox-mode #btn-search,
    body.mailbox-mode #search-bar > span { display: none !important; }

    #mailbox-tabs { display: flex; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .mb-tab { flex: 1; padding: 6px 8px; border-radius: 5px; border: 1px solid transparent;
      background: transparent; color: var(--muted); font-size: 11px; cursor: pointer; }
    .mb-tab:hover { color: var(--text); }
    .mb-tab.active { background: var(--accent-bg); color: var(--accent2); border-color: var(--accent-border); }
    .wf-state { font-size: 10px; padding: 1px 7px; border-radius: 10px; font-family: var(--mono);
      background: var(--surface2); color: var(--muted); flex-shrink: 0; }
    .wf-state.pending { background: var(--warn-bg); color: var(--warn); }
    .wf-state.claimed { background: var(--accent-bg); color: var(--accent2); }
    .wf-state.approved, .wf-state.acknowledged { background: var(--ok-bg); color: var(--ok); }
    .wf-state.rejected { background: var(--err-bg); color: var(--err); }
    .wf-state.recalled { background: var(--surface2); color: var(--muted); }
    .wf-state.paid { background: rgba(59,130,246,.14); color: #3b82f6; }
    .wf-stamp-link { border: none; background: none; padding: 0; color: var(--accent2); font-size: 11px;
      cursor: pointer; text-decoration: underline; font-family: var(--sans); }
    .wf-stamp-link:hover { color: var(--accent); }
    .wf-note { margin: 8px 0; width: 100%; }

    #body { display: flex; flex: 1; overflow: hidden; }

    /* ── Results pane ─────────────────────────────────────────────────────── */
    #results-pane {
      width: 380px; flex-shrink: 0; display: flex; flex-direction: column;
      border-right: 1px solid var(--border); overflow: hidden;
    }
    #results-scroll { flex: 1; overflow-y: auto; padding: 8px 0; }

    .section-header {
      padding: 6px 14px 4px; font-size: 10px; letter-spacing: .1em;
      text-transform: uppercase; color: var(--muted);
      border-bottom: 1px solid var(--border); background: var(--surface);
      position: sticky; top: 0; z-index: 1;
    }
    .section-count { font-family: var(--mono); color: var(--accent2); margin-left: 4px; }

    .result-item { padding: 9px 14px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background .1s; }
    .result-item:hover  { background: var(--surface2); }
    .result-item.active { background: var(--accent-bg); border-left: 2px solid var(--accent); padding-left: 12px; }
    /* Recycle-bin multi-select highlight */
    .result-item.selected { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }
    /* Recycle-bin selection toolbar (in the results header) */
    #results-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--surface);
      position: sticky; top: 0; z-index: 2; }
    #results-head:empty, #results-head.hidden { display: none; }   /* no empty bar outside the bin */
    .bin-count { font-size: 12px; font-weight: 600; color: var(--text); }
    .bin-actions { display: flex; gap: 8px; }
    .btn-sm { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border2);
      background: var(--surface); color: var(--text); font-family: var(--sans); font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm.danger { color: var(--err); border-color: var(--err-border, rgba(214,69,69,.4)); }
    .btn-sm.danger:hover { background: var(--err-bg); border-color: var(--err); }
    /* Right-click context menu */
    #bin-context-menu { position: fixed; z-index: 1000; min-width: 170px; padding: 5px;
      background: var(--surface); border: 1px solid var(--border2); border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 2px; }
    #bin-context-menu button { text-align: left; padding: 8px 10px; border: none; border-radius: 6px;
      background: transparent; color: var(--text); font-family: var(--sans); font-size: 13px; cursor: pointer; }
    #bin-context-menu button:hover { background: var(--surface2); }
    #bin-context-menu button.danger { color: var(--err); }
    #bin-context-menu button.danger:hover { background: var(--err-bg); }
    /* Result-row page-1 thumbnail (shared/thumbs.js). Empty element = placeholder
       box; the rendered page fills it once loaded. No renderable thumb → empty box. */
    .result-row  { display: flex; align-items: flex-start; gap: 10px; }
    .result-main { flex: 1; min-width: 0; }
    .result-thumb { flex-shrink: 0; width: 38px; height: 50px; border-radius: 4px;
                    background: var(--doc-bg); border: 1px solid var(--border);
                    object-fit: cover; object-position: top center; }

    .result-header { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
    .result-supplier { font-size: 12px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .result-type-badge { flex-shrink: 0; font-size: 10px; padding: 1px 7px; border-radius: 10px; background: var(--accent-bg); color: var(--accent2); border: 1px solid var(--accent-border); }
    .result-filename { font-family: var(--mono); font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 2px; }
    .result-footer { display: flex; align-items: center; justify-content: space-between; }
    .result-date { font-size: 10px; color: var(--muted); font-family: var(--mono); }
    .result-status-badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; }
    .result-status-badge.review   { background: var(--warn-bg); color: var(--warn); }
    .result-status-badge.deferred { background: var(--accent-bg); color: #a080f0; }

    #results-empty { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 12px; }

    /* ── Preview pane ─────────────────────────────────────────────────────── */
    #preview-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--doc-bg); }
    #preview-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
    #preview-doc { flex: 1; display: flex; flex-direction: row; overflow: hidden; }

    /* Image column: stacks image area above page nav */
    #preview-img-col { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

    #preview-img-area {
      flex: 1; overflow: auto; display: flex; align-items: flex-start;
      justify-content: center; padding: 16px; min-height: 0;
    }
    #preview-img { max-width: 100%; max-height: 100%; border: 1px solid var(--border); border-radius: 4px; display: block; object-fit: contain; }
    #preview-img-placeholder { color: var(--muted); font-size: 12px; margin: auto; }

    /* Page navigation bar */
    #page-nav {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 7px 12px; background: var(--surface); border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .page-nav-btn {
      background: var(--surface2); border: 1px solid var(--border2); color: var(--text);
      border-radius: 4px; width: 28px; height: 24px; font-size: 15px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: border-color .12s, color .12s;
    }
    .page-nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .page-nav-btn:disabled { opacity: .35; cursor: default; }
    .page-nav-label { font-family: var(--mono); font-size: 11px; color: var(--muted); min-width: 44px; text-align: center; }

    /* Sidebar */
    #preview-sidebar { width: 280px; flex-shrink: 0; display: flex; flex-direction: column; border-left: 1px solid var(--border); overflow: hidden; }
    #preview-fields-scroll { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }

    .pf-row { display: flex; flex-direction: column; gap: 3px; }
    .pf-label { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .pf-value { font-size: 12px; color: var(--text); font-family: var(--mono); word-break: break-all; }
    .pf-value.empty { color: var(--border2); font-style: italic; font-family: var(--sans); }
    .pf-conf { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-left: 6px; }
    .pf-divider { height: 1px; background: var(--border); margin: 2px 0; }

    /* ── Confidence signature (enhanced Search) ───────────────────────────────── */
    .result-footer-right { display: flex; align-items: center; gap: 8px; }
    .result-conf { display: inline-flex; align-items: center; gap: 5px; }
    .rc-meter { width: 38px; height: 4px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
    .rc-meter > i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
    .result-conf.warn .rc-meter > i { background: var(--warn); }
    .result-conf.err  .rc-meter > i { background: var(--err); }
    .rc-val { font-family: var(--mono); font-size: 10px; color: var(--muted); }

    .pf-confband { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--surface); }
    .pf-confband .pf-label { flex-shrink: 0; }
    .cb-meter { flex: 1; height: 6px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
    .cb-meter > i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
    .pf-confband.warn .cb-meter > i { background: var(--warn); }
    .pf-confband.err  .cb-meter > i { background: var(--err); }
    .cb-val { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--text); }

    .pf-tint { padding-left: 9px; }
    .pf-tint.pf-ok   { box-shadow: inset 3px 0 0 var(--ok); }
    .pf-tint.pf-warn { box-shadow: inset 3px 0 0 var(--warn); }
    .pf-tint.pf-err  { box-shadow: inset 3px 0 0 var(--err); }
    .pf-note { font-size: 10px; color: var(--warn); line-height: 1.4; }

    #preview-actions { border-top: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; background: var(--surface); overflow-y: auto; }
    .action-btn {
      width: 100%; padding: 7px 12px; border-radius: 5px; border: 1px solid var(--border2);
      background: transparent; color: var(--text); font-family: var(--sans);
      font-size: 11px; cursor: pointer; transition: all .15s; text-align: left;
    }
    .action-btn:hover { border-color: var(--accent2); color: var(--accent2); }
    .action-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; text-align: center; }
    .action-btn.primary:hover { opacity: .85; }

    /* ── Action/status panel sections ─────────────────────────────────────── */
    .ap-status-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px 8px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
    .ap-chip { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-family: var(--mono); white-space: nowrap; }
    .ap-chip.confirmed { background: var(--ok-bg);      color: var(--ok); }
    .ap-chip.review    { background: var(--warn-bg);    color: var(--warn); }
    .ap-chip.deferred  { background: var(--accent-bg);  color: #a080f0; }
    .ap-chip.other     { background: var(--surface2);   color: var(--muted); }
    .ap-confidence     { font-size: 10px; font-family: var(--mono); color: var(--muted); }
    .ap-section        { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
    .ap-section + .ap-section { border-top: 1px solid var(--border); }
    .ap-section-header { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-bottom: 2px; }
    .ap-future-note    { font-size: 11px; color: var(--muted); line-height: 1.5; }

    /* ── Workflow actions (enhanced Search) ───────────────────────────────────── */
    .wf-decision, .wf-assign { display: flex; flex-direction: column; gap: 7px; }
    .wf-banner { font-size: 11px; color: var(--text); background: var(--accent-bg); border: 1px solid var(--accent-border);
      border-radius: 5px; padding: 7px 9px; line-height: 1.45; }
    .wf-acts { display: flex; gap: 6px; flex-wrap: wrap; }
    .wf-acts .action-btn { width: auto; flex: 1; text-align: center; }
    .wf-reason { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
    .wf-sub { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .wf-assign select.search-input, .wf-assign input.search-input { width: 100%; }
    .wf-err { font-size: 11px; color: var(--err); }

    .spinner { width: 18px; height: 18px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  </style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <span class="tb-title">ScanFinder — Search</span>
    <div class="tb-right">
      <button class="tb-btn help-guide-btn" id="btn-help-guide" title="Open the user guide (Search)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></button>
      <button class="tb-btn" id="help-mode-toggle" data-help-key="help-mode" title="Help mode — click, then click any control to learn what it does">?</button>
      <button class="tb-btn close" id="btn-close" title="Close">&#215;</button>
    </div>
  </div>

  <div id="search-bar">
    <input class="search-input" id="inp-fulltext"  type="text" placeholder="Search anything…" title="Searches everything on the document — text, references, amounts, dates and codes. Numbers ignore commas (1137 finds 1,137)." data-help-key="fulltext">
    <span style="font-size:11px; color:var(--muted); white-space:nowrap;">From</span>
    <input class="search-input" id="inp-date-from" data-help-key="date-from" type="date" title="From date">
    <span style="font-size:11px; color:var(--muted);">to</span>
    <input class="search-input" id="inp-date-to"   type="date" title="To date">
    <select id="inp-total-op" class="search-input" title="Total amount filter" style="width:auto;" data-help-key="total-op">
      <option value="eq">Total =</option>
      <option value="gt">Total &gt;</option>
      <option value="lt">Total &lt;</option>
    </select>
    <input class="search-input" id="inp-total" type="text" inputmode="decimal" placeholder="amount" title="Filter by total amount (uses the operator on the left)" style="width:90px;" data-help-key="total">
    <select id="inp-type" data-help-key="type-filter">
      <option value="">All types</option>
    </select>
    <label class="uncommitted-toggle" data-help-key="uncommitted">
      <input type="checkbox" id="chk-uncommitted" checked>
      Include unconfirmed
    </label>
    <button id="btn-search" data-help-key="do-search">Search</button>
    <button id="btn-recycle" data-help-key="recycle-bin" style="display:none">Recycle bin</button>
    <button id="btn-empty-bin" style="display:none">Empty bin</button>
    <button id="btn-mailbox" data-help-key="mailbox" style="display:none">Mailbox</button>
  </div>
  <div id="date-range-note" style="display:none; padding:2px 12px; font-size:12px; color:var(--warn);">
    “From” date is after “To” date — no documents can match. Swap them or clear one.
  </div>

  <div id="body">
    <div id="results-pane" data-help-key="results-pane">
      <div id="mailbox-tabs" style="display:none">
        <button class="mb-tab active" data-box="inbox">Inbox</button>
        <button class="mb-tab" data-box="sent">Sent</button>
        <button class="mb-tab" data-box="assigned">Assigned</button>
        <button class="mb-tab" data-box="completed">Completed</button>
      </div>
      <div id="results-scroll">
        <div id="results-empty" style="display:none">No documents found</div>
      </div>
    </div>

    <div id="preview-pane" data-help-key="preview-pane">
      <div id="preview-empty">Select a document from the results</div>

      <div id="preview-doc" style="display:none">
        <div id="preview-img-col">
          <div id="preview-img-area">
            <span id="preview-img-placeholder">Loading…</span>
            <img id="preview-img" style="display:none" alt="Document preview" draggable="false">
          </div>
          <div id="page-nav" style="display:none">
            <button class="page-nav-btn" id="btn-page-prev" data-help-key="preview-pages" title="Previous page" aria-label="Previous page" disabled>&#8249;</button>
            <span id="page-label" class="page-nav-label">1 / 1</span>
            <button class="page-nav-btn" id="btn-page-next" data-help-key="preview-pages" title="Next page" aria-label="Next page" disabled>&#8250;</button>
          </div>
        </div>

        <div id="preview-sidebar">
          <div id="preview-fields-scroll"></div>
          <div id="preview-actions" data-help-key="preview-actions"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../shared/theme.js"></script>
<script src="../shared/helpmode.js"></script>
<script src="../shared/thumbs.js"></script>
<script src="search-state.js"></script>
<script src="search-actions.js"></script>
<script src="search-results.js"></script>
<script src="search-preview.js"></script>
<script src="search-query.js"></script>
<script src="search-workflow.js"></script>
<script src="search-mailbox.js"></script>
<script src="renderer.js"></script>
</body>
</html>
