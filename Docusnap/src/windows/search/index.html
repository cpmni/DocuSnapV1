<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:">
  <title>DocuSnap — Search</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0c0e14; --surface: #13161f; --surface2: #1a1e2a;
      --border: #252836; --border2: #2f3347;
      --accent: #4f8ef7; --accent2: #6ea8ff;
      --ok: #3ecf8e; --warn: #f7b84f; --err: #f76f6f;
      --text: #e2e6f0; --muted: #7a82a0;
      --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; overflow: hidden; }

    /* Titlebar */
    #titlebar {
      -webkit-app-region: drag;
      display: flex; align-items: center; justify-content: space-between;
      height: 38px; padding: 0 12px 0 16px;
      background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .tb-title { font-size: 11px; font-weight: 500; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
    .tb-btn {
      -webkit-app-region: no-drag;
      width: 26px; height: 20px; border-radius: 4px; border: none; cursor: pointer;
      background: var(--surface2); color: var(--muted); font-size: 13px;
      display: flex; align-items: center; justify-content: center;
    }
    .tb-btn.close:hover { background: var(--err); color: #fff; }

    #app { display: flex; flex-direction: column; height: 100vh; }

    /* Search bar */
    #search-bar {
      display: flex; align-items: center; gap: 8px; padding: 10px 16px;
      background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
    }
    .search-input {
      background: var(--bg); border: 1px solid var(--border2); border-radius: 5px;
      padding: 6px 10px; color: var(--text); font-family: var(--sans); font-size: 12px;
      outline: none; transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }
    #inp-company   { width: 160px; }
    #inp-reference { width: 130px; }
    #inp-date-from, #inp-date-to { width: 120px; color-scheme: dark; }
    #inp-type { background: var(--bg); border: 1px solid var(--border2); border-radius: 5px;
                padding: 6px 10px; color: var(--text); font-family: var(--sans); font-size: 12px;
                outline: none; cursor: pointer; }
    #inp-type:focus { border-color: var(--accent); }
    #btn-search {
      padding: 6px 16px; border-radius: 5px; border: 1px solid var(--accent);
      background: var(--accent); color: #fff; font-family: var(--sans); font-size: 12px;
      cursor: pointer; transition: opacity .15s; margin-left: auto;
    }
    #btn-search:hover { opacity: .85; }
    .uncommitted-toggle { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
    .uncommitted-toggle input { accent-color: var(--accent); cursor: pointer; }

    /* Body */
    #body { display: flex; flex: 1; overflow: hidden; }

    /* Results pane */
    #results-pane {
      width: 380px; flex-shrink: 0; display: flex; flex-direction: column;
      border-right: 1px solid var(--border); overflow: hidden;
    }
    #results-scroll { flex: 1; overflow-y: auto; padding: 8px 0; }

    .section-header {
      padding: 6px 14px 4px; font-size: 10px; letter-spacing: .1em;
      text-transform: uppercase; color: var(--muted);
      border-bottom: 1px solid var(--border); background: var(--surface);
      position: sticky; top: 0; z-index: 1;
    }
    .section-count { font-family: var(--mono); color: var(--accent2); margin-left: 4px; }

    .result-item {
      padding: 9px 14px; cursor: pointer; border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    .result-item:hover  { background: var(--surface2); }
    .result-item.active { background: #0d1f3a; border-left: 2px solid var(--accent); padding-left: 12px; }

    .result-header { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
    .result-supplier { font-size: 12px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .result-type-badge {
      flex-shrink: 0; font-size: 10px; padding: 1px 7px; border-radius: 10px;
      background: #0d1f3a; color: var(--accent2); border: 1px solid #1a3a6a;
    }
    .result-filename { font-family: var(--mono); font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 2px; }
    .result-footer { display: flex; align-items: center; justify-content: space-between; }
    .result-date { font-size: 10px; color: var(--muted); font-family: var(--mono); }
    .result-status-badge {
      font-size: 10px; padding: 1px 6px; border-radius: 10px;
    }
    .result-status-badge.review  { background: #2e1a00; color: var(--warn); }
    .result-status-badge.deferred { background: #1a1530; color: #a080f0; }

    #results-empty { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 12px; }

    /* Preview pane */
    #preview-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #080a0f; }

    #preview-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 13px;
    }

    #preview-doc { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* Image area */
    #preview-img-area {
      flex: 1; overflow: auto; display: flex; align-items: flex-start;
      justify-content: center; padding: 16px; min-height: 0;
    }
    #preview-img {
      max-width: 100%; max-height: 100%; border: 1px solid var(--border);
      border-radius: 4px; display: block; object-fit: contain;
    }
    #preview-img-placeholder {
      color: var(--muted); font-size: 12px; margin: auto;
    }

    /* Fields + actions sidebar */
    #preview-sidebar {
      width: 280px; flex-shrink: 0; display: flex; flex-direction: column;
      border-left: 1px solid var(--border); overflow: hidden;
    }
    #preview-fields-scroll { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    #preview-doc { flex-direction: row; }

    .pf-row { display: flex; flex-direction: column; gap: 3px; }
    .pf-label { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .pf-value { font-size: 12px; color: var(--text); font-family: var(--mono); word-break: break-all; }
    .pf-value.empty { color: var(--border2); font-style: italic; font-family: var(--sans); }

    #preview-actions {
      padding: 12px 14px; border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 7px; flex-shrink: 0;
    }
    .action-btn {
      width: 100%; padding: 7px 12px; border-radius: 5px; border: 1px solid var(--border2);
      background: transparent; color: var(--text); font-family: var(--sans);
      font-size: 11px; cursor: pointer; transition: all .15s; text-align: left;
    }
    .action-btn:hover { border-color: var(--accent2); color: var(--accent2); }
    .action-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; text-align: center; }
    .action-btn.primary:hover { opacity: .85; }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px; border: 2px solid var(--border2);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite; margin: auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  </style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <span class="tb-title">DocuSnap — Search</span>
    <button class="tb-btn close" id="btn-close">&#215;</button>
  </div>

  <div id="search-bar">
    <input class="search-input" id="inp-company"   type="text"  placeholder="Company…">
    <input class="search-input" id="inp-reference" type="text"  placeholder="Reference…">
    <input class="search-input" id="inp-date-from" type="date"  title="From date">
    <input class="search-input" id="inp-date-to"   type="date"  title="To date">
    <select id="inp-type">
      <option value="">All types</option>
    </select>
    <label class="uncommitted-toggle">
      <input type="checkbox" id="chk-uncommitted" checked>
      Include unconfirmed
    </label>
    <button id="btn-search">Search</button>
  </div>

  <div id="body">
    <div id="results-pane">
      <div id="results-scroll">
        <div id="results-empty" style="display:none">No documents found</div>
      </div>
    </div>

    <div id="preview-pane">
      <div id="preview-empty">Select a document from the results</div>

      <div id="preview-doc" style="display:none">
        <div id="preview-img-area">
          <span id="preview-img-placeholder">Loading…</span>
          <img id="preview-img" style="display:none" alt="Document preview">
        </div>

        <div id="preview-sidebar">
          <div id="preview-fields-scroll"></div>
          <div id="preview-actions"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
