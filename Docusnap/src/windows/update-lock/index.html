<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Update required</title>
  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="../shared/theme.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex; flex-direction: column; height: 100vh; }
    .wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 28px; gap: 14px; }
    .icon { width: 46px; height: 46px; color: var(--accent2); }
    h1 { font-size: 20px; font-weight: 700; }
    p { color: var(--muted); max-width: 360px; line-height: 1.5; font-size: 13px; }
    .ver { font-family: var(--mono, monospace); font-size: 12px; color: var(--muted); }
    .btns { display: flex; gap: 10px; margin-top: 10px; }
    button { padding: 9px 18px; border-radius: var(--r-sm, 8px); border: 1px solid var(--border2);
      font-size: 13px; cursor: pointer; font-family: inherit; background: var(--surface); color: var(--text); }
    button.primary { background: var(--accent); color: var(--on-accent, #fff); border-color: var(--accent); }
    button.ghost { background: transparent; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>
    </svg>
    <h1>A required update is available</h1>
    <p>This version of Scan Finder is no longer supported. Please update to keep going — your documents and settings stay on your PC.</p>
    <div class="ver" id="ver"></div>
    <div class="btns">
      <button class="ghost" id="quit">Quit</button>
      <button class="primary" id="update">Update now</button>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
