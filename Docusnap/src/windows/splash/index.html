<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <title>ScanFinder</title>
  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="../shared/theme.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Palette + tokens are centralised in shared/theme.css (light default + matching dark). */

    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text); font-family: var(--sans);
      border: 1px solid var(--border2); overflow: hidden; user-select: none;
      -webkit-app-region: drag;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
    }

    .logo { width: 60px; height: 60px; }
    .wordmark {
      font-size: 22px; font-weight: 600; letter-spacing: .14em;
      text-transform: uppercase; color: var(--text);
    }
    .version { font-family: var(--mono); font-size: 12px; color: var(--accent2); }

    .bar {
      width: 168px; height: 2px; background: var(--border);
      border-radius: 2px; overflow: hidden; margin-top: 4px;
    }
    .bar::after {
      content: ''; display: block; height: 100%; width: 40%;
      background: var(--accent); border-radius: 2px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(310%); }
    }

    .license {
      position: absolute; bottom: 14px; left: 0; right: 0;
      text-align: center; font-size: 10px; color: var(--muted);
      line-height: 1.7; padding: 0 18px;
    }
    .license .tag { color: var(--muted); opacity: .85; }
  </style>
</head>
<body>
  <img class="logo-light" src="../../../assets/logo-lockup.svg" alt="Scan Finder" style="width:170px;height:auto;">
  <img class="logo-dark" src="../../../assets/logo-lockup-dark.svg" alt="" aria-hidden="true" style="width:170px;height:auto;">
  <div class="version" id="version"></div>
  <div class="bar"></div>

  <div class="license">
    <div id="copyright"></div>
    <div class="tag">Licensed software &middot; All processing stays on this PC</div>
  </div>

  <script src="splash.js"></script>
</body>
</html>
