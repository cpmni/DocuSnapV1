<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>ScanFinder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0c0e14;
      --surface: #13161f;
      --border:  #252836;
      --border2: #2f3347;
      --accent:  #4f8ef7;
      --accent2: #6ea8ff;
      --text:    #e2e6f0;
      --muted:   #7a82a0;
      --mono:    'IBM Plex Mono', monospace;
      --sans:    'IBM Plex Sans', sans-serif;
      color-scheme: dark;
    }

    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text); font-family: var(--sans);
      border: 1px solid var(--border2); overflow: hidden; user-select: none;
      -webkit-app-region: drag;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
    }

    .logo { width: 60px; height: 60px; }
    .wordmark {
      font-size: 22px; font-weight: 600; letter-spacing: .14em;
      text-transform: uppercase; color: var(--text);
    }
    .version { font-family: var(--mono); font-size: 12px; color: var(--accent2); }

    .bar {
      width: 168px; height: 2px; background: var(--border);
      border-radius: 2px; overflow: hidden; margin-top: 4px;
    }
    .bar::after {
      content: ''; display: block; height: 100%; width: 40%;
      background: var(--accent); border-radius: 2px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(310%); }
    }

    .license {
      position: absolute; bottom: 14px; left: 0; right: 0;
      text-align: center; font-size: 10px; color: var(--muted);
      line-height: 1.7; padding: 0 18px;
    }
    .license .tag { color: var(--muted); opacity: .85; }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 24 24" fill="none">
    <rect x="3" y="3" width="13" height="17" rx="2" fill="none" stroke="#4f8ef7" stroke-width="1.5"/>
    <path d="M16 3h2a2 2 0 012 2v14a2 2 0 01-2 2h-2" stroke="#4f8ef7" stroke-width="1.5" opacity=".4"/>
    <line x1="7" y1="8" x2="13" y2="8" stroke="#4f8ef7" stroke-width="1.3"/>
    <line x1="7" y1="11.5" x2="13" y2="11.5" stroke="#4f8ef7" stroke-width="1.3" opacity=".6"/>
    <line x1="7" y1="15" x2="10" y2="15" stroke="#4f8ef7" stroke-width="1.3" opacity=".3"/>
  </svg>

  <div class="wordmark">ScanFinder</div>
  <div class="version" id="version"></div>
  <div class="bar"></div>

  <div class="license">
    <div id="copyright"></div>
    <div class="tag">Licensed software &middot; All processing stays on this PC</div>
  </div>

  <script src="splash.js"></script>
</body>
</html>
