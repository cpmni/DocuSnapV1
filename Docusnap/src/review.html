<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>DocuSnap — Review</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0c0e14; --surface: #13161f; --surface2: #1a1e2a;
      --border: #252836; --border2: #2f3347;
      --accent: #4f8ef7; --accent2: #6ea8ff;
      --ok: #3ecf8e; --warn: #f7b84f; --err: #f76f6f;
      --text: #e2e6f0; --muted: #7a82a0;
      --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; overflow: hidden; }

    #titlebar {
      -webkit-app-region: drag;
      display: flex; align-items: center; justify-content: space-between;
      height: 38px; padding: 0 12px 0 16px;
      background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .tb-title { font-size: 11px; font-weight: 500; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
    .tb-right  { display: flex; gap: 8px; -webkit-app-region: no-drag; align-items: center; }
    .tb-btn {
      width: 26px; height: 20px; border-radius: 4px; border: none; cursor: pointer;
      background: var(--surface2); color: var(--muted); font-size: 13px;
      display: flex; align-items: center; justify-content: center;
    }
    .tb-btn.close:hover { background: var(--err); color: #fff; }

    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ── Queue bar ── */
    #queue-bar {
      display: flex; align-items: center; gap: 6px; padding: 7px 16px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      overflow-x: auto; flex-shrink: 0;
    }
    .queue-item {
      padding: 4px 12px; border-radius: 5px; border: 1px solid var(--border2);
      background: var(--bg); cursor: pointer; white-space: nowrap;
      font-size: 11px; color: var(--muted); transition: all .15s; flex-shrink: 0;
    }
    .queue-item:hover  { border-color: var(--accent2); color: var(--accent2); }
    .queue-item.active { border-color: var(--accent); background: #0d1f3a; color: var(--accent2); }
    .queue-empty { font-size: 12px; color: var(--ok); }

    /* ── Body ── */
    #body { display: flex; flex: 1; overflow: hidden; }

    /* ── Document viewer (left) ── */
    #doc-panel {
      flex: 1; display: flex; flex-direction: column;
      border-right: 1px solid var(--border); background: #080a0f; min-width: 0;
    }
    #doc-toolbar {
      display: flex; align-items: center; gap: 8px; padding: 7px 12px;
      border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
    }
    .doc-name { font-family: var(--mono); font-size: 11px; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-nav-btn {
      padding: 4px 10px; border-radius: 5px; border: 1px solid var(--border2);
      background: transparent; color: var(--muted); font-size: 11px; cursor: pointer; flex-shrink: 0;
    }
    .doc-nav-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* selection hint bar */
    #select-hint {
      display: none; align-items: center; gap: 8px;
      padding: 6px 12px; background: #0d1f3a;
      border-bottom: 1px solid var(--accent); font-size: 11px; flex-shrink: 0;
    }
    #select-hint.visible { display: flex; }
    .hint-field { color: var(--accent2); font-weight: 500; }
    .hint-cancel { margin-left: auto; padding: 3px 10px; border-radius: 4px;
      border: 1px solid var(--border2); background: transparent; color: var(--muted);
      font-size: 11px; cursor: pointer; font-family: var(--sans); }
    .hint-cancel:hover { border-color: var(--err); color: var(--err); }

    /* doc image wrapper — needed for canvas overlay */
    #doc-viewer {
      flex: 1; overflow: auto; display: flex;
      align-items: flex-start; justify-content: center; padding: 16px;
    }
    #doc-img-wrap { position: relative; display: inline-block; line-height: 0; }
    #doc-img      { max-width: 100%; border: 1px solid var(--border); border-radius: 4px; display: block; }

    /* selection canvas overlay */
    #sel-canvas {
      position: absolute; inset: 0; display: none;
      border-radius: 4px;
    }
    #sel-canvas.active { display: block; cursor: crosshair; }

    /* OCR spinner overlay */
    #ocr-overlay {
      display: none; position: absolute; inset: 0;
      background: rgba(8,10,15,.65); border-radius: 4px;
      align-items: center; justify-content: center;
      font-size: 12px; color: var(--accent2); flex-direction: column; gap: 8px;
    }
    #ocr-overlay.visible { display: flex; }
    .spinner {
      width: 22px; height: 22px; border: 2px solid var(--border2);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #doc-placeholder { color: var(--muted); font-size: 14px; margin: auto; }

    /* ── Fields panel (right) ── */
    #fields-panel {
      width: 340px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden;
    }
    #fields-header {
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0;
    }
    .fields-header-title { font-size: 12px; font-weight: 500; color: var(--text); }
    .fields-header-sub   { font-size: 10px; color: var(--muted); margin-top: 2px; }

    #fields-scroll {
      flex: 1; overflow-y: auto; padding: 12px 16px;
      display: flex; flex-direction: column; gap: 10px;
    }

    .field-row { display: flex; flex-direction: column; gap: 4px; }
    .field-row-header { display: flex; align-items: center; justify-content: space-between; }
    .field-row-label {
      font-size: 11px; font-weight: 500; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em;
    }
    .conf-badge {
      font-size: 10px; font-family: var(--mono); padding: 1px 6px; border-radius: 10px;
    }
    .conf-badge.high { background: #0d2e1e; color: var(--ok); }
    .conf-badge.mid  { background: #2e2000; color: var(--warn); }
    .conf-badge.low  { background: #2e0d0d; color: var(--err); }

    .field-input {
      width: 100%; padding: 7px 10px; border-radius: 6px;
      border: 1px solid var(--border2); background: var(--bg);
      color: var(--text); font-family: var(--sans); font-size: 12px; outline: none;
      transition: border-color .15s, box-shadow .15s; cursor: text;
    }
    .field-input:focus   { border-color: var(--accent); }
    .field-input.corrected { border-color: var(--warn); }
    .field-input.low-conf  { border-color: var(--err); background: #1a0d0d; }

    /* Active (awaiting zone selection) state */
    .field-input.zone-active {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 2px rgba(79,142,247,.25);
      background: #0d1525;
    }

    /* pick-zone button next to each field */
    .field-input-wrap { display: flex; gap: 6px; align-items: center; }
    .pick-btn {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 5px;
      border: 1px solid var(--border2); background: transparent;
      color: var(--muted); cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .pick-btn:hover     { border-color: var(--accent); color: var(--accent); }
    .pick-btn.picking   { border-color: var(--accent); background: #0d1f3a; color: var(--accent2); }

    /* ── Action bar ── */
    #action-bar {
      display: flex; gap: 8px; padding: 12px 16px;
      border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
    }
    .btn {
      flex: 1; padding: 9px; border-radius: 6px; border: 1px solid var(--border2);
      background: transparent; color: var(--text); font-family: var(--sans);
      font-size: 12px; cursor: pointer; transition: all .15s;
    }
    .btn:hover { border-color: var(--accent2); }
    .btn.confirm { background: var(--ok); border-color: var(--ok); color: #0a1f14; font-weight: 500; }
    .btn.confirm:hover { opacity: .88; }
    .btn.skip { color: var(--muted); }
    .btn.reprocess { color: var(--accent2); border-color: var(--accent); }
    .btn.reprocess:hover { background: #0d1f3a; }
    .btn.reprocess:disabled { opacity: .4; cursor: not-allowed; }

    /* Reprocess spinner */
    .btn-spinner {
      display: inline-block; width: 11px; height: 11px;
      border: 1.5px solid var(--accent2); border-top-color: transparent;
      border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: 4px;
    }

    /* ── Deferred panel ── */
    #deferred-panel {
      display: none; flex-direction: column;
      border-top: 1px solid var(--border); max-height: 180px; flex-shrink: 0;
      background: var(--surface);
    }
    #deferred-panel.visible { display: flex; }
    .deferred-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 16px; border-bottom: 1px solid var(--border);
      font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    }
    .deferred-count { color: var(--warn); font-family: var(--mono); }
    #deferred-list { overflow-y: auto; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
    .deferred-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 8px; border-radius: 5px; background: var(--bg);
      border: 1px solid var(--border); font-size: 11px;
    }
    .deferred-name { font-family: var(--mono); color: var(--warn); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .deferred-review-btn {
      flex-shrink: 0; padding: 3px 8px; border-radius: 4px;
      border: 1px solid var(--border2); background: transparent;
      color: var(--muted); font-size: 10px; cursor: pointer; font-family: var(--sans);
      margin-left: 8px;
    }
    .deferred-review-btn:hover { border-color: var(--accent); color: var(--accent); }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  </style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <span class="tb-title">DocuSnap — Review Queue</span>
    <div class="tb-right">
      <button class="tb-btn close" id="btn-close">&#215;</button>
    </div>
  </div>

  <div id="queue-bar">
    <span class="queue-empty" id="queue-empty" style="display:none">✓ All documents reviewed</span>
  </div>

  <div id="body">
    <!-- Left: document image + selection canvas -->
    <div id="doc-panel">
      <div id="doc-toolbar">
        <span class="doc-name" id="doc-name">No document selected</span>
        <button class="doc-nav-btn" id="btn-page-prev">&#8249; Prev</button>
        <span id="page-indicator" style="font-size:11px; color:var(--muted);">—</span>
        <button class="doc-nav-btn" id="btn-page-next">Next &#8250;</button>
      </div>

      <!-- Zone selection hint -->
      <div id="select-hint">
        <span>Click and drag on the document to select the <span class="hint-field" id="hint-field-name">field</span> value</span>
        <button class="hint-cancel" id="hint-cancel">Cancel</button>
      </div>

      <div id="doc-viewer">
        <span id="doc-placeholder">Select a document from the queue above</span>
        <div id="doc-img-wrap" style="display:none">
          <img id="doc-img" alt="Document preview">
          <canvas id="sel-canvas"></canvas>
          <div id="ocr-overlay">
            <div class="spinner"></div>
            <span>Reading selection…</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: extracted fields -->
    <div id="fields-panel">
      <div id="fields-header">
        <div class="fields-header-title">Extracted Fields</div>
        <div class="fields-header-sub">Click ⊕ then drag on the document to pick a value</div>
      </div>
      <div id="fields-scroll"></div>
      <!-- To Be Reviewed panel -->
      <div id="deferred-panel">
        <div class="deferred-header">
          <span>To Be Reviewed</span>
          <span class="deferred-count" id="deferred-count">0</span>
        </div>
        <div id="deferred-list"></div>
      </div>

      <div id="reprocess-bar" style="padding: 8px 16px 0; flex-shrink:0;">
        <button class="btn reprocess" id="btn-reprocess" style="width:100%; margin-bottom:0;">
          &#9654;&#9654; Reprocess with Learned Data
        </button>
      </div>
      <div id="action-bar">
        <button class="btn skip"    id="btn-skip">Skip</button>
        <button class="btn skip"    id="btn-defer" style="color:var(--warn)">&#8635; Defer</button>
        <button class="btn confirm" id="btn-confirm">✓ Confirm &amp; Rename</button>
      </div>
    </div>
  </div>
</div>

<script src="review_renderer.js"></script>
</body>
</html>
